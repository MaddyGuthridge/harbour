services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - 8090:8090
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /media/maddyflix/1:/extra-filesystems/sde1__maddyflix1:ro
      - /media/maddyflix/2:/extra-filesystems/sdb1__maddyflix2:ro
      - /media/maddyflix/3:/extra-filesystems/sdd1__maddyflix3:ro
      - /mnt/nextcloud:/extra-filesystems/sdc1__nextcloud:ro
      - /mnt/nextcloud-backup:/extra-filesystems/sda__nextcloud-backup:ro
    cap_add:
      - SYS_RAWIO # required for S.M.A.R.T. data
      - SYS_ADMIN # required for NVMe S.M.A.R.T. data
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
    env_file: ".env"
